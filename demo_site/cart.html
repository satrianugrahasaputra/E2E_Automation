<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E2E Test Site - Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --border: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 600px;
            margin: 3rem auto;
            padding: 2rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border);
        }

        .cart-item-name {
            font-weight: 600;
        }

        .cart-item-price {
            color: #818cf8;
            font-weight: 700;
        }

        .total-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .checkout-btn {
            display: block;
            width: 100%;
            text-align: center;
            background-color: var(--primary);
            color: white;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            margin-top: 2rem;
            transition: background-color 0.2s;
            box-sizing: border-box;
        }

        .checkout-btn:hover {
            background-color: var(--primary-hover);
        }

        .empty-cart-msg {
            color: var(--text-muted);
            text-align: center;
            margin: 2rem 0;
        }
    </style>
</head>
<body>

<header>
    <h1>E2E Test Store</h1>
    <a href="index.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Back to Shop</a>
</header>

<div class="container">
    <h2>Your Shopping Cart</h2>
    <div id="cart-list"></div>
    
    <div class="total-container">
        <span>Total:</span>
        <span id="cart-total">$0.00</span>
    </div>

    <button id="checkout-btn" class="checkout-btn" onclick="goToCheckout()">Proceed to Checkout</button>
</div>

<script>
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    const cartList = document.getElementById('cart-list');
    const cartTotal = document.getElementById('cart-total');

    if (cart.length === 0) {
        cartList.innerHTML = '<div class="empty-cart-msg">Your cart is empty.</div>';
        document.getElementById('checkout-btn').disabled = true;
        document.getElementById('checkout-btn').style.opacity = 0.5;
        document.getElementById('checkout-btn').style.cursor = 'not-allowed';
    } else {
        let total = 0;
        cartList.innerHTML = '';
        cart.forEach(item => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'cart-item';
            itemDiv.innerHTML = `
                <span class="cart-item-name">${item.name}</span>
                <span class="cart-item-price">$${item.price.toFixed(2)}</span>
            `;
            cartList.appendChild(itemDiv);
            total += item.price;
        });
        cartTotal.innerText = `$${total.toFixed(2)}`;
    }

    function goToCheckout() {
        window.location.href = 'checkout.html';
    }
</script>
</body>
</html>
