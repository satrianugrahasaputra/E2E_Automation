<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E2E Test Site - Catalog</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --border: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .cart-container {
            position: relative;
        }

        .cart-button {
            background-color: var(--primary);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: background-color 0.2s;
        }

        .cart-button:hover {
            background-color: var(--primary-hover);
        }

        .badge {
            background-color: #ef4444;
            color: white;
            border-radius: 50%;
            padding: 0.1rem 0.5rem;
            font-size: 0.8rem;
        }

        .catalog-container {
            max-width: 1000px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 0.5rem;
        }

        .product-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            flex-grow: 1;
            margin-bottom: 1.5rem;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: #818cf8;
        }

        .btn-add {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            transition: background-color 0.2s;
        }

        .btn-add:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

<header>
    <h1>E2E Test Store</h1>
    <div class="cart-container">
        <a href="cart.html" class="cart-button" id="cart-btn">
            Cart <span class="badge" id="cart-badge">0</span>
        </a>
    </div>
</header>

<div class="catalog-container">
    <h2>Our Products</h2>
    <div class="products-grid">
        <div class="product-card" id="item-1">
            <h3 class="product-title">Premium E2E Test Hoodie</h3>
            <p class="product-desc">Ultra-soft cotton hoodie featuring high-quality print. Perfect for cozy automation runs.</p>
            <div class="product-footer">
                <span class="product-price">$49.99</span>
                <button class="btn-add" id="add-to-cart-1" onclick="addToCart('Premium E2E Test Hoodie', 49.99)">Add to Cart</button>
            </div>
        </div>

        <div class="product-card" id="item-2">
            <h3 class="product-title">Playwright Coffee Mug</h3>
            <p class="product-desc">Keep your coffee hot during those long debugging sessions. Dishwasher safe.</p>
            <div class="product-footer">
                <span class="product-price">$15.99</span>
                <button class="btn-add" id="add-to-cart-2" onclick="addToCart('Playwright Coffee Mug', 15.99)">Add to Cart</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Initialize or load cart
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    updateCartBadge();

    function addToCart(name, price) {
        cart.push({ name, price });
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartBadge();
    }

    function updateCartBadge() {
        document.getElementById('cart-badge').innerText = cart.length;
    }
</script>
</body>
</html>
