<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E2E Test Site - Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --error: #ef4444;
            --success: #22c55e;
            --border: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .register-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        h2 {
            margin-top: 0;
            font-weight: 700;
            font-size: 1.8rem;
            text-align: center;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: #0f172a;
            color: var(--text-color);
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            background-color: var(--primary);
            color: white;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .message {
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            display: none;
        }

        .error {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--error);
            color: #fca5a5;
        }

        .success {
            background-color: rgba(34, 197, 94, 0.15);
            border: 1px solid var(--success);
            color: #86efac;
        }

        .links {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.85rem;
        }

        .links a {
            color: var(--primary);
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="register-card">
    <h2>Create Account</h2>
    <div class="subtitle">Join us to access and explore our e-commerce platform</div>

    <div id="error-msg" class="message error"></div>
    <div id="success-msg" class="message success"></div>

    <form id="register-form" onsubmit="handleRegister(event)">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Choose a username">
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="text" id="email" placeholder="Enter email address">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="At least 6 characters">
        </div>
        <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" placeholder="Repeat password">
        </div>
        <button type="submit" id="register-btn">Register</button>
    </form>

    <div class="links">
        Already have an account? <a href="login.html">Login here</a>
    </div>
</div>

<script>
    function handleRegister(event) {
        event.preventDefault();
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const confirmPassword = document.getElementById('confirm-password').value.trim();
        const errorMsg = document.getElementById('error-msg');
        const successMsg = document.getElementById('success-msg');

        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';

        // Validation logic
        if (!username && !email && !password && !confirmPassword) {
            errorMsg.innerText = 'All fields are required';
            errorMsg.style.display = 'block';
            return;
        }
        if (!username) {
            errorMsg.innerText = 'Username is required';
            errorMsg.style.display = 'block';
            return;
        }
        if (!email) {
            errorMsg.innerText = 'Email is required';
            errorMsg.style.display = 'block';
            return;
        }
        
        // Simple email validation regex
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            errorMsg.innerText = 'Email address is invalid';
            errorMsg.style.display = 'block';
            return;
        }

        if (!password) {
            errorMsg.innerText = 'Password is required';
            errorMsg.style.display = 'block';
            return;
        }
        if (password.length < 6) {
            errorMsg.innerText = 'Password must be at least 6 characters';
            errorMsg.style.display = 'block';
            return;
        }
        if (password !== confirmPassword) {
            errorMsg.innerText = 'Passwords do not match';
            errorMsg.style.display = 'block';
            return;
        }

        // Success
        successMsg.innerText = 'Registration successful! Redirecting...';
        successMsg.style.display = 'block';
        setTimeout(() => {
            window.location.href = 'login.html';
        }, 1200);
    }
</script>
</body>
</html>
